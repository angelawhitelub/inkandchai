[build]
  publish   = "public"
  functions = "netlify/functions"
  command   = "npm install && python3 generate_site.py"

[build.environment]
  NODE_VERSION = "20"

[functions]
  included_files = ["data/ALL_BOOKS.json"]

# Abandoned cart recovery — runs every hour automatically
[functions."auto-recover-carts"]
  schedule = "@hourly"

# Daily unshipped orders CSV report — runs at 9 PM IST (15:30 UTC) every day
[functions."daily-unshipped-report"]
  schedule = "30 15 * * *"

# Auto-mark stale shipped/OFD orders as delivered — runs daily at 4 AM UTC (9:30 AM IST)
# Solves the "stuck in OFD" problem caused by NimbusPost not firing delivered events.
[functions."auto-mark-delivered"]
  schedule = "0 4 * * *"

# Backfill AWBs assigned inside the NimbusPost panel back onto our orders.
# Flips matched orders to "shipped" and notifies the customer. Runs every 15 min.
# Suffix `-background` gives us a 15-minute timeout (vs 10s for sync functions)
# — the loop over notifications regularly blew past the gateway timeout, leaving
# the admin SPA with an HTML error page even though the work was completing.
[functions."nimbuspost-awb-sync-background"]
  schedule = "*/15 * * * *"

# Re-check + retry failed PhonePe refunds — runs every 4 hours. PhonePe fails a
# refund when the day's refund total exceeds that day's received payments; as new
# payments settle through the day, a re-attempt succeeds. Money-safe: never
# re-issues without first confirming no refund is already completed/pending.
[functions."phonepe-retry-refunds-background"]
  schedule = "0 */4 * * *"

# 5-min follow-up confirmation ping for WhatsApp book-order requests placed via
# the bot. Runs every 2 minutes; each row is pinged exactly once thanks to the
# follow_up_sent_at guard column.
[functions."bot-order-followup-background"]
  schedule = "*/2 * * * *"

# Route Supabase Storage image requests through our Netlify-cached proxy so
# each image is fetched from Supabase at most once per 30 days per edge. Cuts
# the "cached egress" quota drain caused by admin-created product covers.
[[redirects]]
  from   = "/spimg/*"
  to     = "/.netlify/functions/img-proxy"
  status = 200
  force  = true

# favicon.ico — redirect to the actual PNG; browsers cache the 301 permanently
# (previously /favicon.ico had no file → fell through to index.html → 55 KB per hit → ~534 MB/week)
[[redirects]]
  from   = "/favicon.ico"
  to     = "/images/favicon-96.png"
  status = 301
  force  = true

# Live Merchant feed for admin-created products (custom_products table). Add this
# URL as a scheduled-fetch feed in Merchant Center so they appear without a deploy.
[[redirects]]
  from   = "/custom-feed.xml"
  to     = "/.netlify/functions/custom-products-feed"
  status = 200


# Source map requests from browser devtools — return 404 cleanly instead of
# falling through to index.html (which wastes bandwidth)
[[redirects]]
  from   = "/js/*.js.map"
  to     = "/404.html"
  status = 404
  force  = true

# /api, /index.php etc — bot/scanner requests, return 404 directly
[[redirects]]
  from   = "/api"
  to     = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/index.php"
  to     = "/404.html"
  status = 404
  force  = true

# Static assets — never redirect
[[redirects]]
  from   = "/images/*"
  to     = "/images/:splat"
  status = 200
  force  = false

[[redirects]]
  from   = "/js/*"
  to     = "/js/:splat"
  status = 200
  force  = false

# Pretty collection/category URLs, e.g. /category/hindi-books/
[[redirects]]
  from   = "/category/*"
  to     = "/category/index.html"
  status = 200
  force  = false

[[redirects]]
  from   = "/collection/*"
  to     = "/collection/index.html"
  status = 200
  force  = false

# Merchant Center was given this older mixed-case generated URL. Keep it
# permanently available and point crawlers to the current canonical product URL.
[[redirects]]
  from   = "/product/david-goggins-combo-hindi-can-t-hurt-me-never-finished--BO-HI/"
  to     = "/product/david-goggins-combo-hindi-cant-hurt-me-never-finished/"
  status = 301
  force  = true

[[redirects]]
  from   = "/product/david-goggins-combo-hindi-can-t-hurt-me-never-finished--bo-hi/"
  to     = "/product/david-goggins-combo-hindi-cant-hurt-me-never-finished/"
  status = 301
  force  = true

# Removed product listing. Return a real 404 instead of falling through to the
# homepage catch-all so old links and crawlers stop treating it as available.
[[redirects]]
  from   = "/product/we-are-there-for-each-other-hindi-edition-by-sagar-chud-RE-HI/"
  to     = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/product/we-are-there-for-each-other-hindi-edition-by-sagar-chud-re-hi/"
  to     = "/404.html"
  status = 404
  force  = true

# Dynamic admin-created product pages. Existing generated product files still
# win first because this redirect is not forced.
[[redirects]]
  from   = "/product/*"
  to     = "/.netlify/functions/product-page?slug=:splat"
  status = 200
  force  = false

# Redirect all non-file requests to index (SPA-style)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
  force  = false

# Security headers — production
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), microphone=()"

# Deploy-preview context: tell search engines not to index preview URLs.
# This prevents bots from crawling deploy-preview--*.netlify.app URLs,
# which currently account for ~2.5 GB/month of wasted bandwidth.
[context.deploy-preview]
  [[context.deploy-preview.headers]]
    for = "/*"
    [context.deploy-preview.headers.values]
      X-Robots-Tag = "noindex, nofollow"

# Cache headers are managed by public/_headers — that file uses Netlify's
# native syntax which has reliable glob matching across subfolders. The TOML
# [[headers]] rules below ONLY had path-matching bugs (e.g. for="/index.html"
# missed /product/index.html etc.) and are intentionally omitted here.
