[build]
  publish   = "public"
  functions = "netlify/functions"
  # build-fbt-signals mines a year of kept orders for real co-purchases and
  # bestsellers (data/fbt-signals.json). It never exits non-zero: if Supabase
  # is unreachable the recommender falls back to similarity and the deploy
  # still goes out.
  command   = "npm install && node scripts/build-catalog-index.js && node scripts/build-fbt-signals.js && python3 generate_site.py"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # ALL_BOOKS is still bundled for the admin/import functions that need full
  # book records. The checkout price path no longer reads it: it requires the
  # prebuilt catalog-index.json instead (scripts/build-catalog-index.js).
  included_files = ["data/ALL_BOOKS.json", "data/catalog-index.json", "data/fbt-signals.json", "data/social_proof.json"]

# Abandoned cart recovery — runs every hour automatically
[functions."auto-recover-carts"]
  schedule = "@hourly"

# Daily unshipped orders CSV report — runs at 9 PM IST (15:30 UTC) every day
[functions."daily-unshipped-report"]
  schedule = "30 15 * * *"

# auto-mark-delivered is NOT scheduled. Delivered status comes from the
# NimbusPost webhook (nimbuspost-webhook.js maps 14 "delivered" spellings).
# The handler is kept and can still be run manually with an X-Admin-Key POST if
# orders are ever found stuck in out_for_delivery.

# Drain the lost-orders blob pen: orders the database refused while it was
# unreachable (paused project, outage) are parked in Netlify Blobs by the
# checkout functions and inserted here once Supabase answers again. An empty
# pen costs one list() call, so a 5-minute interval is effectively free and
# keeps recovery ahead of anyone noticing an order is missing from admin.
[functions."replay-lost-orders"]
  schedule = "*/5 * * * *"

# Cancel pure-COD orders only when no AWB has been assigned for seven days.
# Orders that already have an AWB are never cancelled for lack of movement.
# Prepaid and partial-COD orders are always excluded.
[functions."auto-cancel-stale-cod"]
  schedule = "15 * * * *"

# Backfill AWBs assigned inside NimbusPost every 15 minutes. This short
# scheduled function securely enqueues the separate background worker.
# Every 3 minutes, not 15. NimbusPost's webhook cannot tell us about a NEW AWB
# — its payload carries only awb_number, and the handler finds the order by
# .eq('tracking_id', awb), which is the value we are still missing. So polling
# is the only way an AWB assigned in the panel reaches us, and the interval IS
# the latency. One run scans ~5 pages of 50, so 3 minutes is a handful of API
# calls per run and well inside NimbusPost's limits.
[functions."nimbuspost-awb-sync-scheduled"]
  schedule = "*/3 * * * *"

# Push pending replacement orders into the NimbusPost panel. Replacements have
# no checkout to push them and the AWB sync above only touches orders already in
# the panel, so before this they shipped only when someone pushed them by hand.
# Every 15 minutes, and only for replacements older than the grace window
# (REPLACEMENT_PUSH_GRACE_MINUTES, default 120) so the owner can still edit the
# books — editing is locked once an order is pushed.
[functions."auto-push-replacements-scheduled"]
  schedule = "*/15 * * * *"

# Re-check + retry failed PhonePe refunds — AFTERNOON ONLY (IST).
# PhonePe fails a refund when, on a given settlement date, the refund amount
# exceeds the payments the merchant received that day. Received-payments grow
# through the day, so early-morning retries almost always fail. Running hourly
# across the afternoon (when the day's balance is highest) is when re-attempts
# actually clear. Cron is UTC; IST = UTC+5:30.
#   30 7-12 * * *  → 07:30–12:30 UTC  = 1:00 PM–6:00 PM IST, hourly (6 runs)
[functions."phonepe-retry-refunds-scheduled"]
  schedule = "30 7-12 * * *"

# READ-ONLY refund reconciliation, hourly around the clock. Refunds complete at
# any hour; this flips PENDING → refunded and notifies the customer as soon as
# PhonePe confirms, instead of waiting for the afternoon re-issue window above
# (a refund completing at 12:45 AM used to show "pending" for ~12 hours).
# It never re-issues, so it can't trip the balance policy or burn the attempt cap.
[functions."phonepe-reconcile-refunds-scheduled"]
  schedule = "15 * * * *"

# Catch PhonePe payments that completed but never reached the order row — the
# webhook and the browser redirect can BOTH miss, and when they do the order
# keeps no payment id, so every money check reads it as unpaid and ships it COD.
# 41 orders hit this before anything looked; phonepe-reconcile only ever
# re-checked status='pending_phonepe', which those orders had already left.
# Every 10 minutes, so a dropped payment is found long before the shipment moves.
[functions."phonepe-payment-sweep-scheduled"]
  schedule = "*/10 * * * *"

# 5-min follow-up confirmation ping for WhatsApp book-order requests placed via
# the bot. Runs every 2 minutes; each row is pinged exactly once thanks to the
# follow_up_sent_at guard column.
[functions."bot-order-followup-background"]
  schedule = "*/2 * * * *"

# Personalized customer recommendations - 7:00 PM IST every Tuesday + Friday
# (13:30 UTC). Evening is the strongest window for consumer WhatsApp in India,
# and it stays well clear of the 9 PM - 9 AM quiet hours for marketing sends.
# The function skips safely until WHATSAPP_BROADCAST_TEMPLATE is configured,
# and the send itself is opt-in only - see whatsapp_marketing_subscribers.
[functions."whatsapp-broadcast-scheduled"]
  schedule = "30 13 * * 2,5"

# One-off evening campaign, 20:00 IST. Registered daily because Netlify cron has
# no one-shot form; the function itself sends nothing unless
# WHATSAPP_BROADCAST_ONEOFF_DATE equals today's IST date.
[functions."whatsapp-broadcast-oneoff"]
  schedule = "30 14 * * *"

# Shout if the live site stops matching main. A production deploy made by hand
# carries no commit reference, so the dashboard shows a normal green deploy
# while the site has silently rolled back — which is exactly how a day's worth
# of admin features went missing on 30 Aug 2026. Hourly is soon enough to catch
# it before work is written against code the site is not running.
# Ask recently-delivered customers for a product review, once a day at 10:00 AM
# IST (cron is UTC; IST = UTC+5:30). This was never scheduled before, which is
# the main reason product_reviews held exactly one row -- an admin-entered one.
# Deliberately daily and capped rather than hourly: these are utility-template
# WhatsApps to real customers, and one badly-timed burst costs us the number.
[functions."request-reviews-scheduled"]
  schedule = "30 4 * * *"

[functions."deploy-drift-check"]
  schedule = "@hourly"

# The Netlify subdomain serves the production site verbatim, on a second
# hostname nobody should be landing on. It turned up as a "suggested domain" in
# GA4's cross-domain setup because the tag was detected there, and every hit to
# it is a session recorded against a host that is not the shop.
#
# First rule in the file so it wins before any path-based redirect below.
#
# Only the bare alias matches. Deploy permalinks are served on
# <deploy-id>--dazzling-swan-f25721.netlify.app, a different host, so they stay
# reachable for verifying a rollback — which is the point of them.
[[redirects]]
  from   = "https://dazzling-swan-f25721.netlify.app/*"
  to     = "https://inkandchai.in/:splat"
  status = 301
  force  = true

# Route Supabase Storage image requests through our Netlify-cached proxy so
# each image is fetched from Supabase at most once per 30 days per edge. Cuts
# the "cached egress" quota drain caused by admin-created product covers.
[[redirects]]
  from   = "/spimg/*"
  to     = "/.netlify/functions/img-proxy"
  status = 200
  force  = true

# favicon.ico — redirect to the actual PNG; browsers cache the 301 permanently
# (previously /favicon.ico had no file → fell through to index.html → 55 KB per hit → ~534 MB/week)
[[redirects]]
  from   = "/favicon.ico"
  to     = "/images/favicon-96.png"
  status = 301
  force  = true

# Live Merchant feed for admin-created products (custom_products table). Add this
# URL as a scheduled-fetch feed in Merchant Center so they appear without a deploy.
[[redirects]]
  from   = "/custom-feed.xml"
  to     = "/.netlify/functions/custom-products-feed"
  status = 200

# Paginated Merchant feed for the BULK-IMPORTED catalog (crossword/99bookstores/
# bookstohome rows in custom_products — excluded from /custom-feed.xml). Register
# each page as its own scheduled-fetch feed: /custom-feed-bulk/1, /2, ...
# Page 1's XML comment states the total page count.
[[redirects]]
  from   = "/custom-feed-bulk/:page"
  to     = "/.netlify/functions/custom-products-feed-bulk?page=:page"
  status = 200


# Source map requests from browser devtools — return 404 cleanly instead of
# falling through to index.html (which wastes bandwidth)
[[redirects]]
  from   = "/js/*.js.map"
  to     = "/404.html"
  status = 404
  force  = true

# /api, /index.php etc — bot/scanner requests, return 404 directly
[[redirects]]
  from   = "/api"
  to     = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/index.php"
  to     = "/404.html"
  status = 404
  force  = true

# Static assets — never redirect
[[redirects]]
  from   = "/images/*"
  to     = "/images/:splat"
  status = 200
  force  = false

[[redirects]]
  from   = "/js/*"
  to     = "/js/:splat"
  status = 200
  force  = false

# Pretty collection/category URLs, e.g. /category/hindi-books/
[[redirects]]
  from   = "/category/*"
  to     = "/category/index.html"
  status = 200
  force  = false

[[redirects]]
  from   = "/collection/*"
  to     = "/collection/index.html"
  status = 200
  force  = false

# Merchant Center was given this older mixed-case generated URL. Keep it
# permanently available and point crawlers to the current canonical product URL.
[[redirects]]
  from   = "/product/david-goggins-combo-hindi-can-t-hurt-me-never-finished--BO-HI/"
  to     = "/product/david-goggins-combo-hindi-cant-hurt-me-never-finished/"
  status = 301
  force  = true

[[redirects]]
  from   = "/product/david-goggins-combo-hindi-can-t-hurt-me-never-finished--bo-hi/"
  to     = "/product/david-goggins-combo-hindi-cant-hurt-me-never-finished/"
  status = 301
  force  = true

# Removed product listing. Return a real 404 instead of falling through to the
# homepage catch-all so old links and crawlers stop treating it as available.
[[redirects]]
  from   = "/product/we-are-there-for-each-other-hindi-edition-by-sagar-chud-RE-HI/"
  to     = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/product/we-are-there-for-each-other-hindi-edition-by-sagar-chud-re-hi/"
  to     = "/404.html"
  status = 404
  force  = true

