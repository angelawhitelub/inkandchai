<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Bot Inbox — Ink &amp; Chai</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@300;500;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f1f3f5; --bg2:#f8f9fa; --bg3:#ffffff;
  --cream:#20252b; --cream-dim:#4f5964;
  --gold:#6d4c10; --gold-light:#8a6419;
  --green:#176b35; --orange:#9b5207; --red:#b4232c;
  --border:#cbd1d7; --shadow:0 8px 24px rgba(28,35,43,0.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px}
body{background:var(--bg);color:var(--cream);font-family:'Manrope',sans-serif;font-weight:500;line-height:1.5;
     height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}

nav{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
    padding:0.7rem 1.4rem;background:#fff;border-bottom:1px solid #c6ccd2;flex:0 0 auto}
.logo{font-family:'DM Serif Display',serif;font-size:1.25rem;color:var(--gold);text-decoration:none}
.logo span{font-size:0.7rem;color:var(--cream-dim);font-weight:700;font-style:italic;margin-left:.4rem}
.nav-right{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
button{font-family:inherit}
.btn{font-size:0.8rem;letter-spacing:.08em;text-transform:uppercase;padding:.5rem 1rem;
     border:1px solid var(--border);background:#fff;color:var(--cream);cursor:pointer;border-radius:6px;font-weight:700}
.btn:hover{background:var(--bg2)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.gold:hover{background:var(--gold-light)}
.btn.green{background:#eaf7ee;color:var(--green);border-color:rgba(23,107,53,.35)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ── view switch ────────────────────────────────────────────────────────── */
.viewtabs{display:flex;gap:.35rem}
.viewtab{font-size:.88rem;font-weight:700;padding:.5rem 1.05rem;border:1px solid var(--border);background:#fff;
         color:var(--cream-dim);cursor:pointer;border-radius:6px}
.viewtab.active{background:var(--gold);color:#fff;border-color:var(--gold)}
.viewtab .count{background:var(--red);color:#fff;border-radius:9px;padding:0 .4rem;font-size:.75rem;margin-left:.35rem}
main{flex:1;min-height:0;display:flex}
.view{display:none;flex:1;min-height:0}
.view.active{display:flex}

/* ── inbox ──────────────────────────────────────────────────────────────── */
/* Sized to read like WhatsApp Desktop rather than like a dense data table:
   a 56px row with an avatar, a 15px name, a 14px preview and a 12px timestamp.
   The previous 11-13px text was unreadable at a glance on a large screen. */
.sidebar{width:400px;flex:0 0 400px;border-right:1px solid var(--border);background:var(--bg2);
         display:flex;flex-direction:column;min-height:0}
.sidebar .tools{padding:.75rem;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:.55rem}
.sidebar input[type=search]{width:100%;padding:.6rem .85rem;font-size:.95rem;font-family:inherit;
  border:1px solid var(--border);background:#fff;color:var(--cream);border-radius:8px}
.sidebar input[type=search]:focus{outline:2px solid var(--gold);outline-offset:-1px}
.filters{display:flex;gap:.35rem;flex-wrap:wrap}
.fbtn{font-size:.8rem;font-weight:700;padding:.35rem .75rem;border:1px solid var(--border);background:#fff;
      color:var(--cream-dim);cursor:pointer;border-radius:20px}
.fbtn.active{background:var(--gold);color:#fff;border-color:var(--gold)}
.convlist{flex:1;overflow-y:auto;min-height:0}
.conv{padding:.7rem .85rem;cursor:pointer;width:100%;text-align:left;font-family:inherit;
      background:transparent;border:0;border-bottom:1px solid var(--border);border-left:3px solid transparent;
      display:grid;grid-template-columns:auto 1fr;gap:.75rem;align-items:center}
.conv:hover{background:#fff}
.conv.active{background:#fff;border-left-color:var(--gold)}
/* Avatar: initials on a colour derived from the phone number, so the same
   customer keeps the same colour and rows are distinguishable at a glance. */
.conv .av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
          font-size:1rem;font-weight:700;color:#fff;flex:0 0 auto;letter-spacing:.02em}
.conv .body{min-width:0;display:block}
.conv .top{display:flex;justify-content:space-between;gap:.5rem;align-items:baseline}
.conv .who{font-weight:700;font-size:.95rem;color:var(--cream);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv .when{font-size:.72rem;color:var(--cream-dim);flex:0 0 auto}
.conv.unread .when{color:var(--green);font-weight:700}
.conv .prev{font-size:.85rem;color:var(--cream-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
            margin-top:.2rem;display:flex;align-items:center;gap:.3rem}
.conv .prevtext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Unread count sits right, as a green pill — WhatsApp's own affordance. */
.conv .unread{margin-left:auto;flex:0 0 auto;background:var(--green);color:#fff;font-size:.72rem;font-weight:700;
              min-width:1.35rem;height:1.35rem;padding:0 .4rem;border-radius:1rem;
              display:inline-flex;align-items:center;justify-content:center}
.badge{display:inline-block;font-size:.68rem;font-weight:700;padding:.12rem .45rem;border-radius:5px;flex:0 0 auto}
.b-unread{background:var(--red);color:#fff}
.b-human{background:#e7f0fb;color:#12539b}
.b-resolved{background:#eaf7ee;color:var(--green)}
.b-critical{background:var(--red);color:#fff}
.b-high{background:#fdecea;color:var(--red)}
.b-medium{background:#fdf3e3;color:var(--orange)}

.thread{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg3)}
.empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--cream-dim);font-size:1rem}
.thead{padding:.7rem 1rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;
       gap:.6rem;flex-wrap:wrap;align-items:center;flex:0 0 auto}
.thead .name{font-weight:700;font-size:1.1rem}
.thead .ph{font-size:.85rem;color:var(--cream-dim)}
.tactions{display:flex;gap:.4rem;flex-wrap:wrap}
.msgs{flex:1;overflow-y:auto;padding:1.1rem 1.4rem;display:flex;flex-direction:column;gap:.5rem;min-height:0}
.msg{max-width:66%;padding:.6rem .85rem;border-radius:12px;font-size:1rem;line-height:1.45;white-space:pre-wrap;word-break:break-word;
     box-shadow:0 1px 1px rgba(0,0,0,.06)}
/* Timestamp tucks to the bottom-right of the bubble, WhatsApp-style. */
.msg .meta{font-size:.72rem;color:var(--cream-dim);margin-top:.2rem;text-align:right}
.m-user{align-self:flex-start;background:var(--bg2);border:1px solid var(--border)}
.m-bot{align-self:flex-end;background:#fdf6e6;border:1px solid #e6d6ac}
.m-admin{align-self:flex-end;background:#e7f0fb;border:1px solid #b9d3f0}
.msg.pending{opacity:.55}
.newdivider{align-self:center;font-size:.72rem;font-weight:700;color:var(--red);letter-spacing:.1em;text-transform:uppercase;
            padding:.2rem .6rem;border-top:1px solid rgba(180,35,44,.3);width:100%;text-align:center}
.composer{flex:0 0 auto;border-top:1px solid var(--border);padding:.7rem .9rem;display:flex;gap:.5rem;align-items:flex-end}
.composer textarea{flex:1;padding:.7rem .9rem;font-family:inherit;font-size:1rem;line-height:1.45;border:1px solid var(--border);
  background:#fff;color:var(--cream);border-radius:10px;resize:vertical;min-height:2.9rem;max-height:9rem}
.jump{position:absolute;right:1.4rem;bottom:5.2rem;z-index:5}

/* ── triage ─────────────────────────────────────────────────────────────── */
.triage{flex:1;overflow-y:auto;padding:1.1rem 1.4rem;min-height:0}
.triage-head{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center;margin-bottom:.9rem}
.triage h1{font-family:'DM Serif Display',serif;font-size:1.5rem;font-weight:400}
.triage .sub{font-size:.9rem;color:var(--cream-dim)}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:.9rem 1rem;margin-bottom:.7rem;
      box-shadow:var(--shadow);border-left:5px solid var(--border)}
.card.critical{border-left-color:var(--red)}
.card.high{border-left-color:var(--orange)}
.card.medium{border-left-color:var(--gold-light)}
.card .row1{display:flex;justify-content:space-between;gap:.8rem;flex-wrap:wrap;align-items:baseline}
.card .who{font-weight:700;font-size:1rem}
.card .score{font-size:.82rem;font-weight:700;color:var(--cream-dim)}
.quote{margin:.5rem 0;padding:.55rem .8rem;background:var(--bg2);border-left:3px solid var(--border);
       font-size:.95rem;font-style:italic;color:var(--cream);white-space:pre-wrap;word-break:break-word}
.reasons{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.4rem}
.reason{font-size:.78rem;font-weight:700;padding:.22rem .55rem;border-radius:5px;background:#fdecea;color:var(--red)}
.reason.neg{background:#eaf7ee;color:var(--green)}
.card .foot{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:.6rem}
.card .orders{font-size:.72rem;color:var(--cream-dim)}
.spin{font-size:.85rem;color:var(--cream-dim);padding:1.5rem}
@media(max-width:820px){
  .sidebar{width:100%;flex:1 1 auto}
  .view.active{flex-direction:column}
  .sidebar.hide-mobile{display:none}
}
</style>
</head>
<body>

<nav>
  <a class="logo" href="/admin/">Ink &amp; Chai<span>Bot Inbox</span></a>
  <div class="viewtabs">
    <button class="viewtab active" id="tabInboxBtn" onclick="showView('inbox')">💬 Conversations</button>
    <button class="viewtab" id="tabTriageBtn" onclick="showView('triage')">🚨 Needs attention <span class="count" id="triageCount" style="display:none">0</span></button>
  </div>
  <div class="nav-right">
    <button class="btn" onclick="refreshAll()">↻ Refresh</button>
    <a class="btn" href="/admin/">← Admin</a>
  </div>
</nav>

<main>
  <!-- ── Conversations ──────────────────────────────────────────────────── -->
  <div class="view active" id="view-inbox">
    <aside class="sidebar" id="sidebar">
      <div class="tools">
        <input type="search" id="search" placeholder="🔍 Phone or name…" oninput="setSearch(this.value)"/>
        <div class="filters">
          <button class="fbtn active" onclick="setFilter('all',this)">All</button>
          <button class="fbtn" onclick="setFilter('unread',this)">Unread</button>
          <button class="fbtn" onclick="setFilter('flagged',this)">🚨 Flagged</button>
          <button class="fbtn" onclick="setFilter('takeover',this)">Human</button>
          <button class="fbtn" onclick="setFilter('resolved',this)">Resolved</button>
        </div>
      </div>
      <div class="convlist" id="convlist"><div class="spin">Loading…</div></div>
    </aside>

    <section class="thread" id="thread">
      <div class="empty" id="emptyState">Select a conversation</div>
      <div id="threadBody" style="display:none;flex:1;flex-direction:column;min-height:0">
        <div class="thead">
          <div>
            <div class="name" id="tName">—</div>
            <div class="ph" id="tPhone">—</div>
          </div>
          <div class="tactions" id="tActions"></div>
        </div>
        <div class="msgs" id="msgs"></div>
        <div class="composer">
          <textarea id="reply" rows="2" placeholder="Type a message — Enter sends, Shift+Enter for a new line"></textarea>
          <button class="btn gold" id="sendBtn" onclick="send()">Send</button>
        </div>
      </div>
    </section>
  </div>

  <!-- ── Triage ─────────────────────────────────────────────────────────── -->
  <div class="view" id="view-triage">
    <div class="triage">
      <div class="triage-head">
        <div>
          <h1>Conversations needing a human</h1>
          <div class="sub" id="triageSub">Scanning…</div>
        </div>
        <div class="nav-right">
          <label class="sub">Window
            <select id="triageDays" onchange="loadTriage()" style="font-family:inherit;font-size:.8rem;padding:.35rem .5rem;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--cream);margin-left:.3rem">
              <option value="1">24 hours</option>
              <option value="3" selected>3 days</option>
              <option value="7">7 days</option>
            </select>
          </label>
          <button class="btn" onclick="loadTriage()">↻ Rescan</button>
        </div>
      </div>
      <div id="triageList"><div class="spin">Scanning conversations…</div></div>
    </div>
  </div>
</main>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// Auth — the admin login sets an httpOnly cookie, so this standalone page
// authenticates on the cookie alone. sessionStorage is per-tab and would be
// empty whenever the inbox is opened in its own tab, which is the whole point
// of this page existing.
// ═══════════════════════════════════════════════════════════════════════════
const SESSION_KEY = 'iac_admin_session_v1';
let adminToken = '';
try {
  const s = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null');
  if (s && s.token && s.exp && Date.now() < s.exp) adminToken = s.token;
} catch {}

async function api(url, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  if (adminToken) headers['X-Admin-Token'] = adminToken;
  const res = await fetch(url, { ...opts, headers, credentials: 'same-origin' });
  if (res.status === 401) {
    document.body.innerHTML =
      '<div style="padding:3rem;text-align:center;font-family:Manrope,sans-serif">' +
      '<h2 style="font-weight:500">Session expired</h2>' +
      '<p style="margin:1rem 0;color:#4f5964">Log in on the admin panel, then come back.</p>' +
      '<a href="/admin/" style="color:#6d4c10;font-weight:700">← Go to admin</a></div>';
    throw new Error('unauthorised');
  }
  return res;
}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function ago(ts) {
  if (!ts) return '';
  const m = Math.round((Date.now() - new Date(ts).getTime()) / 60000);
  if (m < 1) return 'now';
  if (m < 60) return m + 'm';
  if (m < 1440) return Math.round(m / 60) + 'h';
  return Math.round(m / 1440) + 'd';
}

// Up to two initials from a name; for a bare phone number the last two digits,
// which is the part an operator actually recognises.
function initials(label) {
  const s = String(label || '').trim();
  if (!s) return '?';
  if (/^[+\d][\d\s-]*$/.test(s)) return s.replace(/\D/g, '').slice(-2) || '#';
  const words = s.split(/\s+/).filter(Boolean);
  return ((words[0][0] || '') + (words.length > 1 ? words[words.length - 1][0] : '')).toUpperCase();
}

// Stable per-phone hue so a conversation keeps its colour between refreshes.
const AVATAR_COLORS = ['#8b5a2b', '#176b35', '#12539b', '#8a2f6b', '#b4232c',
                       '#c07a12', '#2b6f74', '#5a4b9b'];
function avatarColor(phone) {
  const s = String(phone || '');
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}

// ═══════════════════════════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════════════════════════
let conversations = [];
let flaggedPhones = new Map();   // phone -> {severity, score}
let activePhone   = null;
let filter        = 'all';
let search        = '';
let renderedIds   = new Set();   // message ids already in the DOM
let lastSeenCount = 0;
let sending       = false;

function showView(v) {
  document.getElementById('view-inbox').classList.toggle('active', v === 'inbox');
  document.getElementById('view-triage').classList.toggle('active', v === 'triage');
  document.getElementById('tabInboxBtn').classList.toggle('active', v === 'inbox');
  document.getElementById('tabTriageBtn').classList.toggle('active', v === 'triage');
  location.hash = v;
  if (v === 'triage' && !flaggedPhones.size) loadTriage();
}
function setSearch(v) { search = String(v || '').toLowerCase().trim(); renderList(); }
function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

// ═══════════════════════════════════════════════════════════════════════════
// Conversation list
// ═══════════════════════════════════════════════════════════════════════════
async function loadConversations() {
  try {
    const res = await api('/.netlify/functions/bot-inbox?action=list');
    const data = await res.json();
    conversations = data.conversations || [];
    renderList();
  } catch (e) {
    // Never leave "Loading…" on screen — a silent failure looks identical to a
    // slow network, and the reader waits for something that is never coming.
    if (!conversations.length) {
      document.getElementById('convlist').innerHTML =
        `<div class="spin" style="color:var(--red)">Could not load conversations: ${esc(e.message)}<br/><br/>
         <button class="btn" onclick="loadConversations()">Try again</button></div>`;
    }
    throw e;
  }
}

function visibleConversations() {
  return conversations.filter(c => {
    if (filter === 'unread'   && !(c.unread_count > 0)) return false;
    if (filter === 'takeover' && !c.human_takeover)     return false;
    if (filter === 'resolved' && c.status !== 'resolved') return false;
    if (filter === 'flagged'  && !flaggedPhones.has(c.customer_phone)) return false;
    if (search) {
      const hay = (c.customer_phone + ' ' + (c.customer_name || '')).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });
}

function renderList() {
  const list = visibleConversations();
  const el = document.getElementById('convlist');
  if (!list.length) { el.innerHTML = '<div class="spin">No conversations match.</div>'; return; }
  el.innerHTML = list.map(c => {
    const flag = flaggedPhones.get(c.customer_phone);
    const label = c.customer_name || c.customer_phone;
    const unread = Number(c.unread_count || 0);
    return `<button class="conv ${c.customer_phone === activePhone ? 'active' : ''} ${unread > 0 ? 'unread' : ''}" onclick="openThread('${esc(c.customer_phone)}')">
      <span class="av" style="background:${avatarColor(c.customer_phone)}">${esc(initials(label))}</span>
      <span class="body">
        <span class="top">
          <span class="who">${esc(label)}</span>
          <span class="when">${ago(c.last_message_at)}</span>
        </span>
        <span class="prev">
          ${flag ? `<span class="badge b-${flag.severity}">${flag.severity === 'critical' ? '🚨' : '⚠'} ${flag.score}</span>` : ''}
          ${c.human_takeover ? '<span class="badge b-human">HUMAN</span>' : ''}
          ${c.status === 'resolved' ? '<span class="badge b-resolved">DONE</span>' : ''}
          <span class="prevtext">${esc((c.last_message || '').slice(0, 90))}</span>
          ${unread > 0 ? `<span class="unread">${unread > 99 ? '99+' : unread}</span>` : ''}
        </span>
      </span>
    </button>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════════════════════════
// Thread — APPEND-ONLY.
//
// The old inbox rebuilt the whole thread on every 30s poll and again after
// every send, which threw away scroll position mid-read and made the panel
// feel like it was resetting itself. Here each message is rendered once, keyed
// by id, and polling only appends what is new. Scroll is only forced to the
// bottom when the reader was already at the bottom.
// ═══════════════════════════════════════════════════════════════════════════
function atBottom(box) { return box.scrollHeight - box.scrollTop - box.clientHeight < 80; }

function messageEl(m) {
  const role = m.role === 'user' ? 'user' : (m.role === 'admin' ? 'admin' : 'bot');
  const who  = role === 'user' ? 'Customer' : (role === 'admin' ? 'You' : 'Bot');
  const d = document.createElement('div');
  d.className = 'msg m-' + role;
  d.dataset.mid = m.id ?? (m.created_at + '|' + (m.message || '').slice(0, 24));
  d.innerHTML = `${esc(m.message || '')}<div class="meta">${who} · ${new Date(m.created_at).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })}</div>`;
  return d;
}

async function openThread(phone) {
  activePhone = phone;
  renderedIds = new Set();
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('threadBody').style.display = 'flex';
  document.getElementById('msgs').innerHTML = '';
  const conv = conversations.find(c => c.customer_phone === phone) || {};
  document.getElementById('tName').textContent = conv.customer_name || phone;
  document.getElementById('tPhone').textContent = phone;
  renderActions(phone, conv);
  renderList();
  await loadMessages(true);
  api('/.netlify/functions/bot-inbox', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'mark_read', phone }),
  }).then(() => loadConversations()).catch(() => {});
}

async function loadMessages(forceScroll) {
  if (!activePhone) return;
  const phone = activePhone;
  const res = await api('/.netlify/functions/bot-inbox?action=thread&phone=' + encodeURIComponent(phone));
  const data = await res.json();
  if (phone !== activePhone) return;              // reader moved on mid-request
  const box = document.getElementById('msgs');
  const wasAtBottom = forceScroll || atBottom(box);

  // Drop optimistic bubbles once the real rows come back.
  box.querySelectorAll('.msg.pending').forEach(n => n.remove());

  let appended = 0;
  for (const m of (data.messages || [])) {
    const key = String(m.id ?? (m.created_at + '|' + (m.message || '').slice(0, 24)));
    if (renderedIds.has(key)) continue;
    renderedIds.add(key);
    box.appendChild(messageEl(m));
    appended++;
  }
  if (appended && wasAtBottom) box.scrollTop = box.scrollHeight;
}

function renderActions(phone, conv) {
  document.getElementById('tActions').innerHTML = `
    ${!conv.human_takeover ? `<button class="btn" onclick="act('takeover','${esc(phone)}')">🙋 Take over</button>` : ''}
    ${conv.human_takeover  ? `<button class="btn" onclick="act('release','${esc(phone)}')">🤖 Hand to bot</button>` : ''}
    ${conv.status !== 'resolved' ? `<button class="btn green" onclick="act('resolve','${esc(phone)}')">✓ Resolve</button>` : ''}
    <a class="btn" target="_blank" rel="noopener" href="https://wa.me/${esc(phone)}">WhatsApp ↗</a>`;
}

async function act(action, phone) {
  try {
    await api('/.netlify/functions/bot-inbox', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, phone }),
    });
    await loadConversations();
    const conv = conversations.find(c => c.customer_phone === phone) || {};
    if (activePhone === phone) renderActions(phone, conv);
  } catch (e) { alert('Error: ' + e.message); }
}

async function send() {
  const input = document.getElementById('reply');
  const text = input.value.trim();
  if (!text || !activePhone || sending) return;
  const phone = activePhone;

  // Optimistic bubble — the message appears instantly and is replaced by the
  // real row on the next load, so sending never feels like a page reset.
  const box = document.getElementById('msgs');
  const ghost = messageEl({ role: 'admin', message: text, created_at: new Date().toISOString() });
  ghost.classList.add('pending');
  box.appendChild(ghost);
  box.scrollTop = box.scrollHeight;

  input.value = '';
  sending = true;
  document.getElementById('sendBtn').disabled = true;
  try {
    const res = await api('/.netlify/functions/bot-inbox', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'send', phone, text }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.detail ? `${data.error || 'Send failed'}: ${data.detail}` : (data.error || 'Send failed'));
    await loadMessages(true);
  } catch (e) {
    ghost.classList.remove('pending');
    ghost.style.borderColor = 'var(--red)';
    ghost.querySelector('.meta').textContent = 'Not sent — ' + e.message;
    input.value = text;                            // don't lose what was typed
  } finally {
    sending = false;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
  }
}

document.getElementById('reply').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

// ═══════════════════════════════════════════════════════════════════════════
// Triage
// ═══════════════════════════════════════════════════════════════════════════
async function loadTriage() {
  const days = document.getElementById('triageDays').value;
  const list = document.getElementById('triageList');
  list.innerHTML = '<div class="spin">Scanning conversations…</div>';
  try {
    const res = await api('/.netlify/functions/bot-triage?days=' + encodeURIComponent(days));
    const d = await res.json();
    if (d.error) throw new Error(d.error);

    flaggedPhones = new Map((d.results || []).map(r => [r.phone, { severity: r.severity, score: r.score }]));
    const urgent = (d.bands.critical || 0) + (d.bands.high || 0);
    const badge = document.getElementById('triageCount');
    badge.textContent = urgent;
    badge.style.display = urgent ? 'inline-block' : 'none';
    document.getElementById('triageSub').textContent =
      `${d.flagged} of ${d.conversations_scanned} conversations flagged over ${d.window_days} day${d.window_days === 1 ? '' : 's'} · ` +
      `${d.bands.critical} critical · ${d.bands.high} high · ${d.bands.medium} medium`;
    renderList();

    if (!d.results.length) { list.innerHTML = '<div class="spin">Nothing needs a human right now. 🎉</div>'; return; }

    list.innerHTML = d.results.map(r => `
      <div class="card ${r.severity}">
        <div class="row1">
          <span class="who">${esc(r.name || r.phone)}
            <span style="font-weight:500;color:var(--cream-dim);font-size:.8rem">${r.name ? esc(r.phone) : ''}</span>
          </span>
          <span class="score">${r.severity.toUpperCase()} · ${r.score} pts ·
            ${r.customer_spoke_last ? `waiting ${r.waiting_minutes >= 60 ? Math.round(r.waiting_minutes / 60) + 'h' : r.waiting_minutes + 'm'}` : 'bot replied last'}
          </span>
        </div>
        <div class="quote">${esc(r.last_customer_message) || '—'}</div>
        <div class="reasons">${r.reasons.map(x =>
          `<span class="reason ${x.points < 0 ? 'neg' : ''}">${x.points > 0 ? '+' : ''}${x.points} ${esc(x.label)}</span>`).join('')}</div>
        <div class="foot">
          <span class="orders">
            ${r.counts.customer} from customer · ${r.counts.bot} bot · ${r.counts.human} human
            ${r.orders.length ? ' · ' + r.orders.map(o => `${esc(o.id)} <em>(${esc(o.status)})</em>`).join(', ') : ''}
          </span>
          <span style="display:flex;gap:.4rem">
            <button class="btn" onclick="jumpTo('${esc(r.phone)}')">Open chat →</button>
            <a class="btn" target="_blank" rel="noopener" href="https://wa.me/${esc(r.phone)}">WhatsApp ↗</a>
          </span>
        </div>
      </div>`).join('');
  } catch (e) {
    list.innerHTML = `<div class="spin" style="color:var(--red)">Could not scan: ${esc(e.message)}</div>`;
  }
}

function jumpTo(phone) {
  showView('inbox');
  if (!conversations.some(c => c.customer_phone === phone)) {
    conversations.unshift({ customer_phone: phone, customer_name: '', last_message: '', last_message_at: null });
  }
  openThread(phone);
}

// ═══════════════════════════════════════════════════════════════════════════
// Polling — list every 30s, open thread every 12s. Both are additive, so a
// poll landing mid-sentence can no longer wipe what is on screen.
// ═══════════════════════════════════════════════════════════════════════════
async function refreshAll() {
  await loadConversations();
  if (activePhone) await loadMessages(false);
  if (document.getElementById('view-triage').classList.contains('active')) loadTriage();
}

setInterval(() => { if (document.visibilityState === 'visible') loadConversations().catch(() => {}); }, 30000);
setInterval(() => { if (document.visibilityState === 'visible' && activePhone && !sending) loadMessages(false).catch(() => {}); }, 12000);

(async function init() {
  await loadConversations().catch(() => {});
  await loadTriage().catch(() => {});
  if (location.hash === '#triage') showView('triage');
})();
</script>
