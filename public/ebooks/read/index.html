*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--cream);font-family:'Montserrat',sans-serif;font-weight:300;min-height:100vh}
.rd-bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:.8rem;padding:.7rem 1.1rem;background:rgba(13,11,8,.97);border-bottom:1px solid var(--border);flex-wrap:wrap}
.rd-bar a.logo{font-family:'Cormorant Garamond',serif;font-size:1.15rem;color:var(--gold);text-decoration:none}
.rd-title{flex:1;min-width:120px;font-size:.72rem;color:var(--cream-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-bar button{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;padding:.45rem .8rem;background:transparent;color:var(--cream-dim);border:1px solid var(--border);border-radius:3px;cursor:pointer}
.rd-bar button:hover{border-color:var(--gold);color:var(--gold)}
.rd-page{font-size:.68rem;color:var(--cream-dim);min-width:72px;text-align:center}
#rdPages{max-width:1000px;margin:0 auto;padding:1.2rem .8rem 4rem;display:flex;flex-direction:column;gap:1.1rem;align-items:center}
#rdPages canvas{width:100%;height:auto;max-width:900px;box-shadow:0 2px 18px rgba(0,0,0,.5);background:#fff;border-radius:2px}
.rd-msg{max-width:620px;margin:5rem auto;text-align:center;padding:0 1.2rem;font-size:.82rem;line-height:1.9;color:var(--cream-dim)}
.rd-msg a{color:var(--gold)}
.rd-msg button{margin-top:1.2rem;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;padding:.7rem 1.3rem;background:var(--gold);color:#1a1410;border:none;border-radius:3px;cursor:pointer}
/* Selection and dragging are turned off so a page cannot be dragged out as an
   image. This is friction, not protection -- see the note in ebook-file.js. */
#rdPages{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#rdPages canvas{pointer-events:none}
/* Printing would render every canvas to paper or to a PDF, which is the thing
   this whole page exists to avoid. */
@media print{body *{display:none!important}body::after{content:"Printing is not available for eBooks.";display:block!important;padding:2rem;font-family:sans-serif;color:#000}}
</style>

<script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.6.82/build/pdf.worker.min.mjs';

const msg   = document.getElementById('rdMsg');
const pages = document.getElementById('rdPages');
let pdf = null, scale = 1.35;

function slugFromUrl() {
  const m = location.search.match(/[?&]slug=([^&]+)/);
  return m ? decodeURIComponent(m[1]).toLowerCase().replace(/[^a-z0-9-]/g, '') : '';
}

// Sample mode needs no session at all: ebook-sample is public, and the file it
// serves contains only the opening pages.
const isSample = /[?&]sample=1/.test(location.search);

function say(html) { msg.innerHTML = html; msg.style.display = 'block'; }

async function waitForAuth(ms = 6000) {
  // auth.js resolves its session asynchronously; asking too early reads as
  // signed out on a hard refresh.
  const until = Date.now() + ms;
  while (Date.now() < until) {
    if (window.IAC && window.IAC.getUser && window.IAC.getUser()) return true;
    await new Promise(r => setTimeout(r, 150));
  }
  return !!(window.IAC && window.IAC.getUser && window.IAC.getUser());
}

async function render() {
  pages.innerHTML = '';
  document.getElementById('rdPageNo').textContent = pdf.numPages + ' pages';
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    // Render at device resolution so text stays sharp on a phone.
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width  = Math.floor(viewport.width * dpr);
    canvas.height = Math.floor(viewport.height * dpr);
    pages.appendChild(canvas);
    await page.render({
      canvasContext: canvas.getContext('2d'),
      viewport,
      transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null,
    }).promise;
  }
}

window.rdZoom = async function (dir) {
  if (!pdf) return;
  scale = Math.max(0.6, Math.min(3, scale + dir * 0.25));
  await render();
};

(async function start() {
  const slug = slugFromUrl();
  if (!slug) { say('No book selected. <a href="/ebooks/">Go to your eBooks</a>.'); return; }

  if (!isSample && !await waitForAuth()) {
    say('Please sign in to read this book.<br><button type="button" id="rdSignIn">Sign in</button>');
    const b = document.getElementById('rdSignIn');
    if (b) b.onclick = () => window.IAC && window.IAC.openAuthModal && window.IAC.openAuthModal();
    return;
  }

  try {
    const token = isSample ? '' : await window.IAC.getToken();
    // For a bought book the JWT travels as a header, so the PDF has no URL
    // anyone could share. A sample has nothing worth protecting.
    const task = pdfjsLib.getDocument({
      url: (isSample ? '/.netlify/functions/ebook-sample?slug=' : '/.netlify/functions/ebook-file?slug=')
           + encodeURIComponent(slug),
      httpHeaders: isSample ? {} : { Authorization: 'Bearer ' + token },
      withCredentials: false,
      // Range requests would need the endpoint to serve 206s; it does not, and
      // a whole-file fetch is simpler and correct.
      disableRange: true,
      disableStream: true,
    });
    pdf = await task.promise;
    msg.style.display = 'none';
    document.getElementById('rdTitle').textContent = isSample
      ? 'Free sample · first ' + pdf.numPages + ' pages'
      : 'Your copy · do not share';
    await render();
    if (isSample) showSampleEnd(slug);
  } catch (e) {
    const m = String(e && e.message || e);
    if (/401|403/.test(m)) say('This book is not in your library. <a href="/ebooks/">See your eBooks</a>.');
    else say('Could not open the book.<br><span style="font-size:.7rem">' + m.replace(/[<>]/g, '') + '</span>');
  }
})();

/** After the last sample page, the one thing a sample is for. */
function showSampleEnd(slug) {
  const card = document.createElement('div');
  card.style.cssText = 'max-width:900px;width:100%;margin:.6rem auto 0;padding:1.6rem 1.4rem;'
    + 'border:1px solid var(--border);border-radius:4px;background:var(--bg3);text-align:center';
  card.innerHTML = '<div style="font-family:Cormorant Garamond,serif;font-size:1.4rem;color:var(--gold);margin-bottom:.4rem">'
    + 'End of the sample</div>'
    + '<p style="font-size:.78rem;color:var(--cream-dim);margin-bottom:1rem">Buy the eBook to read the rest, instantly.</p>'
    + '<button type="button" id="rdBuy" style="font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;'
    + 'padding:.75rem 1.4rem;background:var(--gold);color:#1a1410;border:none;border-radius:3px;cursor:pointer">Buy the eBook</button>';
  pages.appendChild(card);
  const b = card.querySelector('#rdBuy');
  if (b) b.onclick = function () { location.href = '/ebooks/?buy=' + encodeURIComponent(slug); };
}

// Friction, deliberately modest: someone determined has the bytes the moment
// the page renders. This only removes the one-click routes.
document.addEventListener('contextmenu', e => { if (e.target.tagName === 'CANVAS') e.preventDefault(); });
document.addEventListener('dragstart', e => e.preventDefault());
</script>
