<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>No connection &mdash; Ink &amp; Chai</title>
<meta name="robots" content="noindex"/>
<link rel="manifest" href="/manifest.json"/>
<style>
  :root{--bg:#0d0b08;--fg:#faf7f2;--dim:#a99f92;--gold:#c9a84c;--line:#2a241c}
  @media (prefers-color-scheme:light){:root{--bg:#faf7f2;--fg:#1a1510;--dim:#6b6155;--line:#e2dad0}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem;
       background:var(--bg);color:var(--fg);
       font-family:Manrope,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center}
  .wrap{max-width:26rem}
  img{width:64px;height:64px;border-radius:14px;margin-bottom:1.5rem}
  h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:1.6rem;margin:0 0 .75rem}
  p{color:var(--dim);line-height:1.6;margin:0 0 1.75rem;font-size:.95rem}
  button{font:inherit;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;
         padding:.85rem 2rem;border-radius:999px;border:1px solid var(--gold);
         background:transparent;color:var(--gold);cursor:pointer}
  button:active{background:rgba(201,168,76,.12)}
  .note{margin-top:1.75rem;padding-top:1.5rem;border-top:1px solid var(--line);
        font-size:.78rem;color:var(--dim)}
</style>
<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZPZDFWMDP6"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-ZPZDFWMDP6');
</script>
<!-- End Google Analytics 4 -->
</head>
<body>
  <div class="wrap">
    <img src="/images/icon-192.png" alt=""/>
    <h1>You are offline</h1>
    <p>We could not reach Ink &amp; Chai. Your cart is saved on this device &mdash;
       nothing has been lost. Pages you have already opened will still work.</p>
    <button onclick="location.reload()">Try again</button>
    <div class="note">Orders already placed are unaffected. You can track them
       at inkandchai.in/track once you are back online.</div>
  </div>
  <script>addEventListener('online',function(){location.reload()});</script>
<!--IAC-SW--><script>if('serviceWorker'in navigator){addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})});}</script><!--/IAC-SW-->
</body>
</html>
