name = "inkandchai"
main = "worker/index.js"
compatibility_date = "2026-09-04"
compatibility_flags = ["nodejs_compat"]

# The generated static site. Requests that are not /.netlify/functions/* fall
# through to these assets, which keeps _redirects and _headers working exactly
# as they did on Pages.
[assets]
directory = "public"
binding = "ASSETS"
# Serve the generated 404 page for anything unmatched, and let /x resolve to
# /x/index.html the way Netlify and Pages both did.
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# The asset router runs BEFORE the Worker, and with not_found_handling
# = "404-page" the 404 page counts as a match -- so on a browser
# navigation (Sec-Fetch-Mode: navigate) any path without a prebuilt
# file was answered with 404.html and the Worker never ran. That hid
# every function-backed route from real browsers while curl and fetch
# (which do not send that header) saw correct 200s. Force the Worker
# to run first on the routes it owns; it still calls ASSETS.fetch()
# internally, so the ~2,740 prebuilt product pages keep winning.
run_worker_first = [
  "/product/*",
  # Not a real file -- the Worker builds it from KV so the baked category grids
  # can drop cards for deleted books between regenerations.
  "/deleted-products.json",
  # Same idea: admin-written catalogue copy, which scripts/sync-catalog-content.mjs
  # pulls down so the next `npm run build` bakes it into the pages and feed.xml.
  "/catalog-content.json",
  "/.netlify/images",
  "/spimg/*",
  "/custom-feed.xml",
  "/custom-feed-bulk/*",
  "/.netlify/functions/*",
  # The WooCommerce-shaped order feed XpressBees polls. Both patterns are
  # needed: a bare "/wp-json" does not match "/wp-json/*", and that exact
  # path is the discovery probe a channel importer makes first.
  "/wp-json",
  "/wp-json/*",
]

# Workers has no filesystem, no Netlify Blobs, and the Razorpay SDK is built on
# node:http. Aliasing at bundle time means none of the 149 handlers had to
# change. See worker/shims/ for what each one implements.
[alias]
"fs" = "./worker/shims/fs.js"
"node:fs" = "./worker/shims/fs.js"
"@netlify/blobs" = "./worker/shims/netlify-blobs.js"
"razorpay" = "./worker/shims/razorpay.js"

# Lost-orders pen: orders parked here when Supabase is unreachable at checkout,
# replayed by replay-lost-orders.
[[kv_namespaces]]
binding = "ORDER_FALLBACK"
id = "e0e7661b15fd47548524833af974deab"

# Wave 1: sync and reporting only. The money jobs (auto-cancel-stale-cod,
# phonepe-retry-refunds, auto-mark-delivered, the WhatsApp broadcasts) stay off
# until their backlog has been reviewed by hand — they have not run since the
# Netlify suspension and would act on months of stale order state.
[triggers]
crons = [
  "*/3 * * * *",   # nimbuspost-awb-sync-scheduled
  "*/5 * * * *",   # replay-lost-orders, phonepe-payment-sweep-scheduled
  "15 * * * *",    # auto-cancel-stale-cod (phonepe-reconcile-refunds shares this
                   # trigger and is held off by ENABLED_JOBS in worker/scheduled-jobs.mjs)
  "0 * * * *",     # auto-recover-carts, deploy-drift-check, support-ticket-sla-scheduled
  "30 15 * * *",   # daily-unshipped-report
  "*/2 * * * *",   # bot-order-followup-background
  "*/15 * * * *",  # auto-push-replacements-scheduled
  "30 7-12 * * *", # phonepe-retry-refunds-scheduled, rto-auto-refund-scheduled
  "30 4 * * *",    # request-reviews-scheduled
  "30 14 * * *",   # whatsapp-broadcast-oneoff
  "30 13 * * 2,5", # whatsapp-broadcast-scheduled
  "0 22 * * *",     # bestseller-agent-scheduled
  "30 3 * * *",    # xpressbees-queue-cleanup-scheduled
]

# The handlers build data-file paths with path.join(__dirname, ...), which does
# not exist in an ESM bundle. Defining it keeps those expressions working; the
# fs shim resolves by basename, so the directory part is only a placeholder.
[define]
__dirname = "'/var/task/netlify/functions'"
__filename = "'/var/task/netlify/functions/handler.js'"

[vars]
# Workers Paid allows 1000 subrequests per invocation. The sweep spends ~2 per
# order (PhonePe status + a Supabase write), plus Supabase paging, and
# replay-lost-orders shares the invocation -- so 300 leaves comfortable margin
# under 1000 while clearing the backlog in a few runs. The handler's own default
# is 400; raise this toward that only if the margin proves unnecessary.
PHONEPE_SWEEP_MAX = "300"

# Automatic prepaid RTO refunds (rto-auto-refund-scheduled): paid minus both
# shipping legs, issued only after the courier's own tracking shows the parcel
# delivered back to us. "off" stops every automatic refund; the admin tab's
# buttons keep working either way. At most RTO_AUTO_REFUND_MAX_PER_RUN a run.
RTO_AUTO_REFUND = "on"
RTO_AUTO_REFUND_MAX_PER_RUN = "25"

# Daily cancel of XpressBees panel queue rows for orders another courier already
# carries (xpressbees-queue-cleanup-scheduled). Unbooked rows only. "off" stops it.
XPRESSBEES_QUEUE_CLEANUP = "on"

# Support tickets (inkandchai.in/support/). The hourly watchdog that tells a
# customer their ticket is taking longer than 24-48 h ("off" stops it), and
# whether those updates also go out as WhatsApp templates -- leave "off" until
# ticket_received / ticket_delay_update / ticket_resolved are approved in Meta
# (whatsapp-templates/support_tickets.md). Email always goes.
SUPPORT_TICKET_SLA = "on"
SUPPORT_TICKET_WHATSAPP = "off"

# The monthly ceiling on Ink AI's OpenAI spend, in US dollars. The per-IP rate
# limit stops one visitor looping; this stops the bill when traffic is spread
# across many. At ~$0.0078 a reply this buys roughly 3,200 conversations a
# month. Raise it here and redeploy; the code falls back to 25 if it is unset.
INK_AI_MONTHLY_BUDGET_USD = "25"

# The PRIVATE bucket holding eBook PDFs. It must never be given an r2.dev
# public origin or a custom domain: reads happen only through the short-lived
# signed URLs ebook-download.js mints for customers who have paid.
R2_EBOOK_BUCKET = "inkandchai-ebooks"

# Netlify injected URL automatically. whatsapp-broadcast-scheduled reads
# process.env.URL with no domain fallback, so without this it would send
# messages containing link-less URLs. Every other caller falls back already.
URL = "https://inkandchai.in"

# Rate limit for Ink AI, which is public and spends money on every call.
#
# Two lighter options were tried and dropped: a counter in module scope (resets
# with every isolate -- a 14-request burst sailed through all fourteen) and
# Cloudflare's Rate Limiting binding (unsafe.bindings, type "ratelimit"), which
# binds and returns cleanly but never refuses on this account -- 14 sequential
# calls against a 4-per-10s limit were all allowed. It is in beta and evidently
# not enabled here, and a limiter that silently allows everything is worse than
# none because it looks like one.
#
# A Durable Object is single-threaded per key, so the count is exact. See
# worker/rate-limiter.js.
[[durable_objects.bindings]]
name = "INK_AI_LIMIT"
class_name = "RateLimiter"

[[durable_objects.bindings]]
name = "INK_AI_SPEND"
class_name = "SpendGuard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SpendGuard"]

[[durable_objects.bindings]]
name = "CUSTOMER_CLAIMS"
class_name = "ClaimGuard"

[[migrations]]
tag = "v3-customer-claims"
new_sqlite_classes = ["ClaimGuard"]
